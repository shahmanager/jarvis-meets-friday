<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" role="img" aria-labelledby="title"><title id="title">PROPOSED: demand-driven AWS start and safe idle stop</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#42636a"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="300,97 360,97" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,97 700,97" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="840,145 840,295" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="700,345 640,345" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="360,345 300,345" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="160,295 160,145" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="50" width="280" height="95" rx="10" fill="white" stroke="#4c8c85" stroke-width="1.5"/><text x="34" y="77" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">1. Durable pending task</text><text x="34" y="99" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Office stays online</text><text x="34" y="119" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Authenticated wake request</text><rect x="360" y="50" width="280" height="95" rx="10" fill="white" stroke="#8770ad" stroke-width="1.5"/><text x="374" y="77" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">2. Short wake controller</text><text x="374" y="99" font-family="Arial,sans-serif" font-size="16" fill="#435a62">API Gateway + Lambda</text><text x="374" y="119" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Start allowed EC2 instance</text><rect x="700" y="50" width="280" height="95" rx="10" fill="white" stroke="#c58e40" stroke-width="1.5"/><text x="714" y="77" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">3. VM boots; reports ready</text><text x="714" y="99" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Named tunnel + services</text><text x="714" y="119" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Dispatch only when healthy</text><rect x="700" y="295" width="280" height="100" rx="10" fill="white" stroke="#c58e40" stroke-width="1.5"/><text x="714" y="322" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">4. Task holds active lease</text><text x="714" y="344" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Heartbeat while tools run</text><text x="714" y="364" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Checkpoint and save receipts</text><rect x="360" y="295" width="280" height="100" rx="10" fill="white" stroke="#8770ad" stroke-width="1.5"/><text x="374" y="322" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">5. Verify true idle</text><text x="374" y="344" font-family="Arial,sans-serif" font-size="16" fill="#435a62">EventBridge / idle controller</text><text x="374" y="364" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Drain; reject uncertain state</text><rect x="20" y="295" width="280" height="100" rx="10" fill="white" stroke="#a7b6b4" stroke-width="1.5"/><text x="34" y="322" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">6. Stop EC2 safely</text><text x="34" y="344" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Compute off; EBS remains</text><text x="34" y="364" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Next task requests wake</text></svg>