<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title"><title id="title">One mission: persistent state around each tool</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#42636a"/></marker></defs><rect width="100%" height="100%" fill="white"/><polyline points="300,95 360,95" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,95 700,95" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="840,140 840,270" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="700,320 640,320" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="360,320 300,320" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><polyline points="500,270 500,210 840,210 840,140" fill="none" stroke="#42636a" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="50" width="280" height="90" rx="10" fill="white" stroke="#4c8c85" stroke-width="1.5"/><text x="34" y="77" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">1. Submit mission</text><text x="34" y="99" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Browser sends request</text><text x="34" y="119" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Worker authenticates owner</text><rect x="360" y="50" width="280" height="90" rx="10" fill="white" stroke="#4c8c85" stroke-width="1.5"/><text x="374" y="77" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">2. Persist and plan</text><text x="374" y="99" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Durable Object saves task</text><text x="374" y="119" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Codex chooses next tool</text><rect x="700" y="50" width="280" height="90" rx="10" fill="white" stroke="#a7b6b4" stroke-width="1.5"/><text x="714" y="77" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">3. Check permission</text><text x="714" y="99" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Validate exact arguments</text><text x="714" y="119" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Approve protected effects</text><rect x="700" y="270" width="280" height="100" rx="10" fill="white" stroke="#c58e40" stroke-width="1.5"/><text x="714" y="297" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">4. Execute real tool</text><text x="714" y="319" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Search, Chromium or Python</text><text x="714" y="339" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Persist result and receipt</text><rect x="360" y="270" width="280" height="100" rx="10" fill="white" stroke="#c58e40" stroke-width="1.5"/><text x="374" y="297" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">5. Observe and continue</text><text x="374" y="319" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Return evidence to Codex</text><text x="374" y="339" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Adapt or finish the task</text><rect x="20" y="270" width="280" height="100" rx="10" fill="white" stroke="#4c8c85" stroke-width="1.5"/><text x="34" y="297" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#193a43">6. Deliver artifact</text><text x="34" y="319" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Store named HTML / PDF</text><text x="34" y="339" font-family="Arial,sans-serif" font-size="16" fill="#435a62">Show Result and download</text></svg>