name: Prototype checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node --test harness/bridge.test.mjs
      - run: node scripts/eval-collaboration.mjs --self-test
      - run: node --test executor/policy.test.mjs executor/artifacts.test.mjs executor/network.test.mjs executor/telemetry.test.mjs
      - run: python -m unittest discover -s companion -p 'test_*.py'
      - run: npm run test:integration
      - run: npm run test:team
      - run: npm run test:office
      - run: node scripts/cloud-status-integration.mjs
      - run: npm run test:autonomy
      - run: npm run test:capabilities
      - run: node scripts/harness-integration.mjs

  cloud-codex-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jarvis-friday-codex ./harness
      - run: docker run --rm --entrypoint sh jarvis-friday-codex -c 'test -s /etc/ssl/certs/ca-certificates.crt'
      - run: >-
          docker run --rm --cap-drop ALL --security-opt no-new-privileges
          --memory 2g --cpus 2 --pids-limit 256
          -v "$PWD/harness:/fixture:ro" --entrypoint node
          jarvis-friday-codex /fixture/protocol-smoke.mjs
