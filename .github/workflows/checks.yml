name: Prototype checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/eval-collaboration.mjs --self-test
      - run: node --test executor/policy.test.mjs executor/artifacts.test.mjs executor/network.test.mjs
      - run: python -m unittest discover -s companion -p 'test_*.py'
      - run: npm run test:integration
      - run: npm run test:team
      - run: npm run test:office
      - run: npm run test:autonomy
      - run: npm run test:capabilities
